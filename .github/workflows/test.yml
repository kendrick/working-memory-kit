name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bats:
    name: bats (${{ matrix.os }})
    strategy:
      fail-fast: false   # show both OSes; macOS exists to catch BSD/GNU divergence
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # npx runs bats from npm with no package.json and no per-OS install step;
      # every GitHub runner already ships Node. The version is pinned for
      # reproducibility. This keeps the install path language-agnostic (the kit
      # itself adds no package.json); Node is only a dev/test-time tool.
      - name: Run tests
        run: npx --yes bats@1.13.0 test/

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        # --severity=error keeps this additive: it guards against real breakage
        # without failing on init.sh's pre-existing warnings (false positives
        # from the prompt_read variable indirection). Tighten later if desired.
        run: shellcheck --severity=error init.sh template/scripts/*.sh
