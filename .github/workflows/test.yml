name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bats:
    name: bats (${{ matrix.os }})
    strategy:
      fail-fast: false   # show both OSes; macOS exists to catch BSD/GNU divergence
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # npx runs bats from npm with no package.json and no per-OS install step;
      # every GitHub runner already ships Node. The version is pinned for
      # reproducibility. This keeps the install path language-agnostic (the kit
      # itself adds no package.json); Node is only a dev/test-time tool.
      - name: Run tests
        run: npx --yes bats@1.13.0 test/

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck
        run: shellcheck init.sh template/scripts/*.sh

  # init.ps1 and the .ps1 hooks are parity-written against the bash side; Pester
  # is the only thing that exercises that PowerShell behaviorally (the bats suite
  # covers bash). windows-latest is the required gate: PowerShell's native home,
  # where CRLF and encoding edge cases surface. macos-latest mirrors local dev
  # and catches cross-platform pwsh drift in CI rather than on one machine.
  # pester-desktop below reruns the suite on Windows PowerShell 5.1, the engine the
  # installed hooks actually launch (`powershell`, not `pwsh`).
  pester:
    name: pester (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # windows-latest ships the legacy Pester 3.4 in $PSHOME; force-install v5
      # to CurrentUser and import it explicitly so Invoke-Pester resolves to it.
      # -SkipPublisherCheck is required because 3.4 and 5.x have different signers.
      - name: Run Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 5.5.0
          Invoke-Pester -Path test/ -CI

  pester-desktop:
    name: pester (windows-latest, Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Exit 1 on any other edition: a runner image change could hand this job pwsh 7,
      # and it would pass without testing 5.1.
      - name: Check edition
        shell: powershell
        run: |
          "PSEdition: $($PSVersionTable.PSEdition)"
          "PSVersion: $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSEdition -ne 'Desktop') { exit 1 }
      # 5.1 defaults to TLS 1.0/1.1, which the PowerShell Gallery refuses, and needs
      # the NuGet provider before Install-Module can run unattended.
      - name: Run Pester
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 5.5.0
          Invoke-Pester -Path test/ -CI

  # Catches pwsh-7-only syntax and cmdlets in the Windows scripts without waiting on a 5.1 runner.
  psscriptanalyzer:
    name: psscriptanalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # -Path takes one string, so each target gets its own call.
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = 'init.ps1', 'template/scripts' | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Settings ./PSScriptAnalyzerSettings.psd1 }
          if ($r) { $r | Format-Table -AutoSize | Out-String -Width 200 | Write-Host; exit 1 }
